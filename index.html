  <style>
    :root {
      color-scheme: dark;
      --ink: #f9f0dc;
      --muted: #aa9a83;
      --bg: #17120f;
      --panel: #211a16;
      --panel-light: #2b211b;
      --line: rgba(255, 238, 207, .1);
      --gold: #ffca70;
      --orange: #f19158;
      --mint: #9bd3a0;
      --danger: #ff7d79;
      --shadow: 0 24px 80px rgba(0, 0, 0, .34);
      font-family: "Oxanium", "Trebuchet MS", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-width: min(320px, 100%);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 16%, rgba(133, 76, 42, .19), transparent 48%),
        radial-gradient(ellipse at 88% 85%, rgba(58, 91, 66, .1), transparent 32%),
        var(--bg);
    }
    button { font: inherit; }
    button:not(:disabled):hover {
      filter: brightness(1.1) saturate(1.08);
      box-shadow: 0 0 0 1px rgba(255,202,112,.18), 0 0 20px rgba(255,202,112,.22), inset 0 0 18px rgba(255,202,112,.1);
    }
    button:not(:disabled):not(.cookie-button):focus-visible {
      outline: 2px solid rgba(255,202,112,.72);
      outline-offset: 3px;
      filter: brightness(1.08);
    }
    .app { min-height: 100vh; padding: 30px 28px 128px; }
    .app.auth-locked { visibility: hidden; }
    .dock-wrap.auth-locked { visibility: hidden; }
    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      padding: 10px 14px;
      border: 1px solid rgba(255, 238, 207, .12);
      border-radius: 20px;
      background: rgba(23, 18, 15, .98);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .24);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1240px;
      margin: 0 auto;
    }
    .brand { display: flex; min-width: 0; gap: 12px; align-items: center; }
    .brand-mark {
      display: block; width: 42px; height: 42px; flex: 0 0 42px; overflow: hidden;
      border: 1px solid rgba(255, 202, 112, .35); border-radius: 15px;
      background: rgba(255, 202, 112, .09);
    }
    .brand-mark svg { display:block; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 8px rgba(255,202,112,.24)); }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: .025em; white-space: nowrap; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: .11em; text-transform: uppercase; white-space: nowrap; }
    .top-status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
    .top-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; }
    .facebook-open-button { display:flex; flex:0 0 auto; min-height:42px; padding:9px 13px; align-items:center; gap:8px; border:1px solid rgba(117,176,255,.48); border-radius:14px; color:#fff; background:linear-gradient(135deg,#2677e8,#1455b8); box-shadow:0 7px 22px rgba(24,95,199,.24),inset 0 1px rgba(255,255,255,.2); font-size:11px; font-weight:850; white-space:nowrap; cursor:pointer; transition:transform .176s,box-shadow .176s; }
    .facebook-open-button:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(24,95,199,.38); }
    .facebook-open-button svg { width:17px; height:17px; flex:0 0 17px; }

    .facebook-galaxy-open-button:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(198,132,43,.42); }
    .facebook-galaxy-open-button svg { width:17px; height:17px; flex:0 0 17px; }
    .vip-open-button { display:flex; flex:0 0 auto; min-height:42px; padding:9px 13px; align-items:center; gap:8px; border:1px solid rgba(198,175,255,.46); border-radius:14px; color:#eee6ff; background:linear-gradient(135deg,#654da5,#38295f); box-shadow:0 7px 22px rgba(89,64,155,.22); font-size:11px; font-weight:850; white-space:nowrap; cursor:pointer; transition:transform .176s,box-shadow .176s; }
    .vip-open-button:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(119,88,195,.35); }

    .facebook-panel { display:flex; flex-direction:column; width:min(620px,100%); max-height:calc(100vh - 36px); max-height:calc(100dvh - 36px); overflow:hidden; border:1px solid rgba(117,176,255,.48); border-radius:24px; background:radial-gradient(ellipse at 50% 0,rgba(52,126,237,.18),transparent 56%),#171b24; box-shadow:0 28px 100px rgba(0,0,0,.7),0 0 60px rgba(48,117,223,.16); animation:auth-rise .3s ease both; }
    .facebook-panel-head { display:flex; flex:0 0 auto; align-items:flex-start; gap:14px; padding:24px 24px 14px; }

    .facebook-notice-scroll p { margin:0; font-size:13px; line-height:1.8; }
    .facebook-notice-scroll hr { height:1px; margin:20px 0; border:0; background:linear-gradient(90deg,rgba(117,176,255,.08),rgba(117,176,255,.7),rgba(117,176,255,.08)); }
    .facebook-panel-footer { flex:0 0 auto; padding:13px 24px 22px; border-top:1px solid rgba(255,255,255,.08); }
    .facebook-read-hint { margin:0 0 11px; color:#9eacc0; font-size:11px; line-height:1.5; }
    .facebook-proceed { display:flex; min-height:50px; width:100%; align-items:center; justify-content:center; gap:9px; border:1px solid rgba(157,199,255,.55); border-radius:15px; color:white; background:linear-gradient(110deg,#3285f2,#1556b7); box-shadow:0 8px 24px rgba(28,101,209,.25); font:inherit; font-size:13px; font-weight:900; text-decoration:none; transition:transform .16s,opacity .16s,box-shadow .16s; }
    .facebook-proceed:not([aria-disabled="true"]):hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(28,101,209,.4); }
    .facebook-proceed[aria-disabled="true"] { opacity:.45; pointer-events:none; filter:grayscale(.4); }
    .facebook-proceed svg { width:18px; height:18px; }
    .facebook-dialog.facebook-gold { background:rgba(18,12,5,.84); }
    .facebook-gold .facebook-panel { border-color:rgba(255,202,112,.55); background:radial-gradient(ellipse at 50% 0,rgba(255,202,112,.2),transparent 56%),#211a16; box-shadow:0 28px 100px rgba(0,0,0,.7),0 0 60px rgba(223,163,73,.2); }
    .facebook-gold .facebook-panel-mark { color:#2a1b0d; background:linear-gradient(145deg,#ffe3a1,#d99431); box-shadow:0 5px 18px rgba(198,132,43,.38); }
    .facebook-gold .facebook-panel-head h2 { color:#ffe6ad; }
    .facebook-gold .facebook-panel-kicker { color:#ffca70; }
    .facebook-gold .facebook-close { color:#ffe6ad; }
    .facebook-gold .facebook-notice-scroll { color:#e4d5b9; scrollbar-color:#c79040 rgba(255,255,255,.08); }
    .facebook-gold .facebook-notice-scroll hr { background:linear-gradient(90deg,rgba(255,202,112,.08),rgba(255,202,112,.72),rgba(255,202,112,.08)); }
    .facebook-gold .facebook-read-hint { color:#c7b38f; }
    .facebook-gold .facebook-proceed { border-color:rgba(255,224,160,.65); color:#2a1b0d; background:linear-gradient(110deg,#ffe3a1,#df9d3b); box-shadow:0 8px 24px rgba(198,132,43,.3); }
    .facebook-gold .facebook-proceed:not([aria-disabled="true"]):hover { box-shadow:0 12px 30px rgba(198,132,43,.48); }
    .facebook-backup-link { display:block; margin-top:10px; color:#e5bd78; font-size:11px; line-height:1.5; text-align:center; text-decoration:underline; text-underline-offset:3px; }
    .facebook-backup-link[aria-disabled="true"] { opacity:.48; pointer-events:none; }
    .facebook-backup-link:focus-visible { outline:2px solid rgba(255,202,112,.72); outline-offset:3px; border-radius:4px; }
    .offline-cookie-dialog { position:fixed; z-index:140; inset:0; display:grid; overflow:auto; padding:18px; place-items:center; background:rgba(9,6,5,.84); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); animation:auth-fade .24s ease both; }
    .offline-cookie-dialog[hidden] { display:none; }
    .offline-cookie-dialog.is-closing { animation:overlay-exit .24s ease-in both; pointer-events:none; }
    .offline-cookie-dialog.is-closing .offline-cookie-panel { animation:dialog-exit .24s cubic-bezier(.4,0,.8,.3) both; }
    .offline-cookie-panel { width:min(560px,100%); max-height:calc(100vh - 36px); max-height:calc(100dvh - 36px); overflow:auto; padding:25px; border:1px solid rgba(255,202,112,.42); border-radius:24px; background:radial-gradient(ellipse at 50% 0,rgba(255,202,112,.15),transparent 58%),#211a16; box-shadow:0 28px 100px rgba(0,0,0,.7),0 0 55px rgba(223,163,73,.14); animation:auth-rise .3s ease both; }
    .offline-cookie-kicker { color:#ffca70; font-size:10px; font-weight:850; letter-spacing:.16em; }
    .offline-cookie-panel h2 { margin:8px 0; color:#ffe6ad; font-family:"Cinzel Decorative","Oxanium",serif; font-size:clamp(22px,5vw,30px); }
    .offline-cookie-copy { margin:0 0 18px; color:#e4d5b9; font-size:13px; line-height:1.7; }
    .offline-cookie-stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:0 0 17px; }
    .offline-cookie-stat { min-width:0; padding:13px; border:1px solid rgba(255,202,112,.14); border-radius:18px; background:rgba(255,202,112,.045); }
    .offline-cookie-stat-label { color:#c7b38f; font-size:10px; }
    .offline-cookie-stat-value { margin-top:5px; overflow-wrap:anywhere; color:#ffe4a6; font-size:clamp(14px,3.5vw,19px); font-weight:850; transition:color .22s ease,text-shadow .22s ease; }
    .offline-cookie-stat-value.is-counting { color:#fff3c5; text-shadow:0 0 16px rgba(255,202,112,.55); }
    .offline-cookie-limit { margin:0 0 17px; color:#c7b38f; font-size:10px; line-height:1.55; }
    .offline-multiplier-label { margin:0 0 9px; color:#ffe6ad; font-size:11px; font-weight:800; }
    .offline-multiplier-options { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 15px; }
    .offline-multiplier-pill { min-height:36px; padding:7px 12px; border:1px solid rgba(255,202,112,.28); border-radius:999px; color:#f0d6a2; background:rgba(255,202,112,.07); font-size:11px; font-weight:850; cursor:pointer; transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .22s ease,color .22s ease,background .22s ease,box-shadow .22s ease; }
    .offline-multiplier-pill[aria-pressed="true"] { transform:scale(1.055); border-color:rgba(255,224,160,.85); color:#25190d; background:linear-gradient(110deg,#ffe3a1,#df9d3b); box-shadow:0 4px 15px rgba(198,132,43,.24),0 0 22px rgba(255,202,112,.28); animation:offline-multiplier-pick .34s cubic-bezier(.16,1,.3,1) both; }
    @keyframes offline-multiplier-pick { 0% { transform:scale(.94); } 68% { transform:scale(1.09); } 100% { transform:scale(1.055); } }
    .offline-cookie-claim { display:flex; min-height:48px; width:100%; align-items:center; justify-content:center; border:1px solid rgba(255,224,160,.65); border-radius:999px; color:#2a1b0d; background:linear-gradient(110deg,#ffe3a1,#df9d3b); box-shadow:0 8px 24px rgba(198,132,43,.28); font-size:13px; font-weight:900; cursor:pointer; }
    .bakery-ai-open { display:flex; flex:0 0 auto; min-height:42px; padding:9px 14px; align-items:center; gap:8px; border:1px solid rgba(255,202,112,.55); border-radius:999px; color:#2a1b0d; background:linear-gradient(120deg,#ffe5ab,#e6a849); box-shadow:0 7px 22px rgba(198,132,43,.22); font-size:11px; font-weight:900; white-space:nowrap; cursor:pointer; transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s ease; }
    .bakery-ai-open:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(198,132,43,.36); }
    .bakery-ai-wordmark { display:inline-grid; min-width:23px; height:23px; place-items:center; font-family:"Cinzel Decorative","Oxanium",serif; font-size:14px; font-weight:900; letter-spacing:-.11em; line-height:1; text-indent:-.08em; text-shadow:0 1px 0 rgba(255,255,255,.42); }
    .bakery-ai-dialog { position:fixed; z-index:160; inset:0; display:grid; overflow:auto; padding:18px; place-items:center; background:rgba(9,6,5,.84); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); animation:auth-fade .24s ease both; }
    .bakery-ai-dialog[hidden] { display:none; }
    .bakery-ai-dialog.is-closing { animation:overlay-exit .24s ease-in both; pointer-events:none; }
    .bakery-ai-dialog.is-closing .bakery-ai-panel { animation:dialog-exit .24s cubic-bezier(.4,0,.8,.3) both; }
    .bakery-ai-panel { display:flex; flex-direction:column; width:min(680px,100%); height:min(760px,calc(100vh - 36px)); height:min(760px,calc(100dvh - 36px)); overflow:hidden; border:1px solid rgba(255,202,112,.42); border-radius:28px; background:radial-gradient(ellipse at 50% 0,rgba(255,202,112,.13),transparent 55%),#211a16; box-shadow:0 28px 100px rgba(0,0,0,.7),0 0 55px rgba(223,163,73,.14); animation:auth-rise .3s ease both; }
    .bakery-ai-head { display:flex; flex:0 0 auto; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid rgba(255,238,207,.1); }
    .bakery-ai-mark { display:grid; width:42px; height:42px; flex:0 0 42px; place-items:center; border:1px solid rgba(255,202,112,.35); border-radius:50%; color:#2a1b0d; background:linear-gradient(135deg,#ffe3a1,#df9d3b); box-shadow:0 4px 16px rgba(198,132,43,.24); font-family:"Cinzel Decorative","Oxanium",serif; font-size:15px; font-weight:900; letter-spacing:-.12em; text-indent:-.08em; }

    .bakery-ai-thread { display:flex; flex:1 1 auto; min-height:0; flex-direction:column; gap:12px; padding:18px 20px; overflow:auto; overscroll-behavior:contain; scroll-behavior:smooth; }
    .bakery-ai-message { max-width:min(88%,520px); padding:12px 15px; border:1px solid rgba(255,202,112,.16); border-radius:22px; color:#f3e5cc; background:rgba(255,202,112,.06); font-size:12px; line-height:1.7; overflow-wrap:anywhere; white-space:pre-line; }
    .bakery-ai-message.user { align-self:flex-end; border-color:rgba(255,202,112,.35); border-bottom-right-radius:8px; color:#2a1b0d; background:linear-gradient(120deg,#ffe3a1,#df9d3b); font-weight:750; }

    @keyframes bakery-ai-owner-imessage-send {
      0% { opacity:0; filter:blur(7px); transform:translate3d(88px,68px,0) scale(.38) rotate(3deg); box-shadow:0 0 0 rgba(255,202,112,0); }

      function closeAnimatedOverlay(element) {

          element.hidden = true;
          element.classList.remove("is-closing");
          return Promise.resolve();
        }
        element.classList.add("is-closing");
        const closing = new Promise(resolve => {
          let finished = false;
          const finish = event => {
            if (event && event.target !== element) return;
            if (finished) return;
            finished = true;
            clearTimeout(fallback);
            element.removeEventListener("animationend", finish);
            element.removeEventListener("transitionend", finish);
            element.hidden = true;
            element.classList.remove("is-closing");

      function downloadBakeryBackup(filename) {
        let backupUrl;
        const link = document.createElement("a");
        try {
          const backup = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), game: state }, null, 2)], { type: "application/json" });
          backupUrl = URL.createObjectURL(backup);
          link.href = backupUrl;
          link.download = `${filename}.json`;
          link.hidden = true;
          document.body.appendChild(link);
          link.click();
          showToast("Your bakery backup download was started.");
        } catch (error) {
          console.error("Could not create the local bakery backup.", error);
          showToast("This browser could not create your bakery backup.");
        } finally {
          link.remove();
          if (backupUrl) setTimeout(() => URL.revokeObjectURL(backupUrl), 1000);
        }
      }

        updateDockHighlight();
      }
      function bakeTap(event) {
        const amount = cookiesPerTap();
        addCookies(amount);
        state.taps = addSafeCounter(state.taps, 1);
        const button = event.currentTarget;
        const owner = isOwner();
        const effectLimit = owner ? 160 : 48;
        cookieAnimations.get(button)?.cancel();
        const interactionDuration = owner ? 920 : 384;
        const pressFrames = owner ? [
          { transform: "scale(1) rotate(0deg)" },
          { transform: "scale(.78,.72) rotate(-8deg)", offset: .16 },
          { transform: "scale(1.13,1.18) rotate(5deg)", offset: .4 },
          { transform: "scale(.97,1.02) rotate(-2deg)", offset: .68 },
          { transform: "scale(1) rotate(0deg)" }
        ] : [
          { transform: "scale(1) rotate(0deg)" },
          { transform: "scale(.82,.76) rotate(-6deg)", offset: .2 },
          { transform: "scale(1.09,1.12) rotate(4deg)", offset: .45 },
          { transform: "scale(.98,1.01) rotate(-2deg)", offset: .7 },
          { transform: "scale(1) rotate(0deg)" }
        ];
        const pressAnimation = button.animate(pressFrames, { duration: interactionDuration, easing: "cubic-bezier(.16,1,.3,1)" });
        cookieAnimations.set(button, pressAnimation);
        const cookieSvg = button.querySelector(".cookie-svg");
        cookieAnimations.get(cookieSvg)?.cancel();
        const turnFrames = owner ? [
          { transform: "rotate(0deg) scale(1)", filter: "brightness(1)" },
          { transform: "rotate(-16deg) scale(1.08)", filter: "brightness(1.25)", offset: .24 },
          { transform: "rotate(12deg) scale(1.15)", filter: "brightness(1.4)", offset: .48 },
          { transform: "rotate(-5deg) scale(1.04)", filter: "brightness(1.18)", offset: .72 },
          { transform: "rotate(0deg) scale(1)", filter: "brightness(1)" }
        ] : [
          { transform: "rotate(0deg) scale(1)" },
          { transform: "rotate(-8deg) scale(1.045)", offset: .35 },
          { transform: "rotate(4deg) scale(.98)", offset: .68 },
          { transform: "rotate(0deg) scale(1)" }
        ];
        const turnAnimation = cookieSvg.animate(turnFrames, { duration: interactionDuration, easing: "cubic-bezier(.16,1,.3,1)" });
        cookieAnimations.set(cookieSvg, turnAnimation);
        const hitX = event.clientX || button.getBoundingClientRect().left + button.offsetWidth / 2;
        const hitY = event.clientY || button.getBoundingClientRect().top + button.offsetHeight / 2;
        const clickEffects = document.createDocumentFragment();
        const addClickEffect = (effect, lifetime) => {
          if (activeCookieEffects >= effectLimit) return;
          activeCookieEffects++;
          clickEffects.appendChild(effect);
          setTimeout(() => {
            effect.remove();
            activeCookieEffects--;
          }, Math.round(lifetime * (owner ? 1.4 : 1)));
        };
        if (activeCookieEffects < effectLimit) {
          if (owner) {
            const flare = document.createElement("span");
            flare.className = "owner-cookie-flare";
            flare.style.left = `${hitX}px`;
            flare.style.top = `${hitY}px`;
            addClickEffect(flare, 1000);
          }
          const ring = document.createElement("span");
          ring.className = owner ? "click-ring owner-click-ring" : "click-ring";
          ring.style.left = `${hitX}px`;
          ring.style.top = `${hitY}px`;
          if (isAdmin()) ring.style.borderColor = "rgba(255,186,226,.92)";
          addClickEffect(ring, 600);
          const sparkCount = owner ? 12 : 6;
          for (let index = 0; index < sparkCount; index++) {
            const angle = (index / sparkCount) * Math.PI * 2;
            const distance = owner ? 76 + index % 3 * 20 : 44;
            const spark = document.createElement("span");
            spark.className = owner ? "click-spark owner-click-spark" : "click-spark";
            spark.style.left = `${hitX}px`;
            spark.style.top = `${hitY}px`;
            spark.style.setProperty("--spark-x", `${Math.cos(angle) * distance}px`);
            spark.style.setProperty("--spark-y", `${Math.sin(angle) * distance}px`);
            spark.style.setProperty("--spark-color", owner ? (index % 3 ? "#ffe08a" : "#fff8d9") : isAdmin() ? (index % 2 ? "#ee70b5" : "#ff9bd3") : index % 2 ? "#f19158" : "#ffca70");
            addClickEffect(spark, 700);
          }
          const float = document.createElement("span");
          float.className = owner ? "float-text owner-float-text" : "float-text";
          float.textContent = `+${fmt(amount)}`;
          float.style.left = `${hitX}px`;
          float.style.top = `${hitY - 12}px`;
          addClickEffect(float, 850);
          const crumbCount = owner ? 10 : 6;
          for (let index = 0; index < crumbCount; index++) {
            const angle = (index / crumbCount) * Math.PI * 2;
            const crumb = document.createElement("span");
            crumb.className = owner ? "click-crumb owner-click-crumb" : "click-crumb";
            crumb.style.left = `${hitX}px`;
            crumb.style.top = `${hitY}px`;
            const distance = owner ? 56 + index % 3 * 18 : 38 + index % 3 * 12;
            crumb.style.setProperty("--crumb-x", `${Math.cos(angle) * distance}px`);
            crumb.style.setProperty("--crumb-y", `${Math.sin(angle) * distance}px`);
            crumb.style.setProperty("--crumb-spin", `${owner ? (index % 2 ? 220 : -220) : (index % 2 ? 150 : -150)}deg`);
            crumb.style.setProperty("--crumb-color", owner ? (index % 3 ? "#f7cf82" : "#fff0b3") : isAdmin() ? (index % 2 ? "#e97db9" : "#ffc3e4") : index % 2 ? "#d88b49" : "#f7cf82");
            addClickEffect(crumb, 900);
          }
          document.body.appendChild(clickEffects);
        }
        scheduleLiveNumberUpdate();
        scheduleTapSave();
      }
      function buyUpgrade(id) {
        const item = upgrades.find(upgrade => upgrade.id === id);
        if (!item) return;
        const price = canBuyForFree() ? 0 : costOf(item);
        if (state.cookies < price && !canBuyForFree()) return;
        state.cookies -= price;
        state.bought[id] = addSafeCounter(owned(id), 1);
        save();
        render();
        showToast(`${item.name} joined your counter.`);
      }
      function affordableUpgradeChoices(items = upgrades) {
        return items
          .filter(item => owned(item.id) < Number.MAX_SAFE_INTEGER)
          .map(item => {
            const price = canBuyForFree() ? 0 : costOf(item);
            return { item, price, valuePerCookie: item.value / Math.max(1, price), index: upgrades.indexOf(item) };
          })
          .filter(candidate => canBuyForFree() || state.cookies >= candidate.price)
          .sort((left, right) =>
            right.valuePerCookie - left.valuePerCookie ||
            left.price - right.price ||
            left.index - right.index
          );
      }
      function bestAffordableUpgrade() {
        return affordableUpgradeChoices()[0] || null;
      }
      function autoBuyBestAffordableUpgrade(showNotification = true) {
        const freeMarket = canBuyForFree();
        const purchasedCounts = new Map();
        const purchaseOrder = [];
        let spent = 0;
        let bought = 0;
        while (true) {
          const candidates = affordableUpgradeChoices(
            upgrades.filter(item => !freeMarket || !purchasedCounts.has(item.id))
          );
          const choice = candidates[0];
          if (!choice) break;
          state.cookies -= choice.price;
          state.bought[choice.item.id] = addSafeCounter(owned(choice.item.id), 1);
          spent += choice.price;
          purchasedCounts.set(choice.item.id, (purchasedCounts.get(choice.item.id) || 0) + 1);
          if (purchaseOrder.length < 5) purchaseOrder.push(choice.item.name);
          bought++;
        }
        if (!bought) return null;
        const earned = awardAchievements();
        save();
        render();
        updateLiveNumbers();
        const result = `Auto-bought ${fmt(bought)} helper${bought === 1 ? "" : "s"} by repeatedly selecting the strongest listed bonus per cookie${purchaseOrder.length ? `; first picks: ${purchaseOrder.join(", ")}` : ""}. ${freeMarket ? "Free-market mode bought one of each helper." : `Spent ${fmt(spent)} cookies.`}${earned.count ? ` You also earned ${fmt(earned.count)} achievement${earned.count === 1 ? "" : "s"} for +${fmt(earned.reward)} cookies.` : ""}`;
        if (showNotification) showToast(result);
        return result;
      }
      function buyBoost(id) {
        const item = boosts.find(boost => boost.id === id);
        const price = canBuyForFree() ? 0 : item?.cost;
        if (!item || state.cookies < price && !canBuyForFree()) return;
        state.cookies -= price;
        state.boostsUsed = addSafeCounter(state.boostsUsed, 1);
        if (item.type === "instant") addCookies(item.amount);
        else state.active.push({ ...item, endsAt: Date.now() + item.duration * roleBoostDurationMultiplier() * 1000 });
        save();
        render();
        showToast(item.type === "instant" ? `${item.amount} cookies rained into your jar!` : `${item.name} is on!`);
      }
      function updateLiveNumbers() {
        const newlyUnlocked = checkAchievements();
        const total = document.getElementById("cookie-total");
        if (total) setCounter(total, "cookies", state.cookies);
        const rate = document.getElementById("rate-value");
        if (rate) setCounter(rate, "rate", cookiesPerSecond());
        const tapRate = document.getElementById("tap-value");
        if (tapRate) setCounter(tapRate, "tap", cookiesPerTap());
        const button = document.getElementById("cookie");
        if (button) button.setAttribute("aria-label", `Bake ${fmt(cookiesPerTap())} cookies`);
        main.querySelectorAll(".shop-buy[data-cost]").forEach(buyButton => {
          buyButton.disabled = state.cookies < Number(buyButton.dataset.cost) && !canBuyForFree();
        });
        const autoBuyButton = main.querySelector("[data-auto-buy-best]");
        if (autoBuyButton) autoBuyButton.disabled = !bestAffordableUpgrade();
        const bakedStat = document.getElementById("stat-baked");
        if (bakedStat) setCounter(bakedStat, "stat-baked", bakedForCounter());
        const tapsStat = document.getElementById("stat-taps");
        if (tapsStat) setCounter(tapsStat, "stat-taps", state.taps);
        const rateStat = document.getElementById("stat-rate");
        if (rateStat) setCounter(rateStat, "stat-rate", cookiesPerSecond());
        const ownedStat = document.getElementById("stat-owned");
        if (ownedStat) setCounter(ownedStat, "stat-owned", Object.values(state.bought).reduce((sum, count) => sum + count, 0));
        const profileBaked = document.getElementById("profile-baked");
        if (profileBaked) setCounter(profileBaked, "profile-baked", bakedForCounter());
        const profileHelpers = document.getElementById("profile-helpers");
        if (profileHelpers) setCounter(profileHelpers, "profile-helpers", Object.values(state.bought).reduce((sum, count) => sum + count, 0));
        const profileTaps = document.getElementById("profile-taps");
        if (profileTaps) setCounter(profileTaps, "profile-taps", state.taps);
        main.querySelectorAll("[data-boost-timer]").forEach(timer => {
          timer.textContent = `${Math.max(0, Math.ceil((Number(timer.dataset.boostTimer) - Date.now()) / 1000))}s left`;
        });
        if (currentPage === "bake") {
          const milestoneData = nextBakingMilestone();
          const currentBaked = bakedBigInt(state.baked);
          const nextGoal = milestoneData ? bakedBigInt(milestoneData.goal) : currentBaked;
          const progress = main.querySelector(".progress-fill");
          if (progress) progress.style.width = `${milestoneData ? Math.min(100, bakedRatioPercent(currentBaked, nextGoal)) : 100}%`;
          const bakedLabel = main.querySelector('[data-counter="progress-baked"]');
          if (bakedLabel) setCounter(bakedLabel, "progress-baked", currentBaked < nextGoal ? (currentBaked <= BigInt(Number.MAX_SAFE_INTEGER) ? Number(currentBaked) : currentBaked) : (nextGoal <= BigInt(Number.MAX_SAFE_INTEGER) ? Number(nextGoal) : nextGoal));
          const milestoneTitle = main.querySelector(".daily-title");
          if (milestoneTitle) milestoneTitle.textContent = milestoneData?.title || "Every baking milestone complete";
          const milestoneCopy = main.querySelector(".daily-copy");
          if (milestoneCopy) milestoneCopy.textContent = milestoneData
            ? `Bake ${fmt(nextGoal)} lifetime cookie${nextGoal === 1n ? "" : "s"} to earn +${fmt(milestoneData.reward)} cookies.`
            : "You have earned every baking milestone in this galaxy.";
          const milestoneGoal = main.querySelector(".progress-label span:last-child");
          if (milestoneGoal) milestoneGoal.textContent = milestoneData ? `${fmt(nextGoal)} cookies` : "Complete";
          main.querySelectorAll(".featured-row [data-counter]").forEach(counter => {
            const key = counter.dataset.counter;
            const id = key.replace("featured-owned-", "");
            setCounter(counter, key, owned(id));
          });
        }
        if (currentPage === "owner" && isOwner()) {
          document.getElementById("owner-cookie-count").textContent = fmt(state.cookies);
          document.getElementById("owner-production-rate").textContent = fmt(cookiesPerSecond());
          document.getElementById("owner-helper-count").textContent = fmt(Object.values(state.bought).reduce((sum, count) => sum + count, 0));
        }
        if (currentPage === "admin" && isAdmin()) {
          const adminCookieCount = document.getElementById("admin-cookie-count");
          if (adminCookieCount) adminCookieCount.textContent = fmt(state.cookies);
          const report = document.getElementById("admin-tool-report");
          if (report) report.textContent = `Cookies: ${fmt(state.cookies)} · helpers: ${fmt(Object.values(state.bought).reduce((sum, count) => sum + count, 0))} · active boosts: ${liveBoosts().length}`;
        }
        if (!newlyUnlocked.count && currentPage === "achievements") updateAchievementProgress();
      }
      document.querySelectorAll(".dock-button").forEach(button => {
        button.addEventListener("click", async () => {
          if (pageTransitioning || accountClosing) return;
          if (button.dataset.page === "owner" && !isOwner()) return;
          if (button.dataset.page === "admin" && !isAdmin()) return;
          if (currentPage === button.dataset.page) {
            showPageWelcome(button.dataset.page, button);
            return;
          }
          const oldIndex = pageOrder.indexOf(currentPage);
          const newIndex = pageOrder.indexOf(button.dataset.page);
          slideDirection = newIndex > oldIndex ? "left" : "right";
          await animatePageExit(main.querySelector(".page"), slideDirection);
          currentPage = button.dataset.page;
          render(true);
          showPageWelcome(button.dataset.page, button);
        });
      });
      facebookOpenButton.addEventListener("click", event => openFacebookNotice("profile", event.currentTarget));
      facebookGalaxyOpenButton.addEventListener("click", event => openFacebookNotice("galaxy", event.currentTarget));
      vipOpenButton.addEventListener("click", () => openVipShop());
      bakeryAiOpenButton.addEventListener("click", openBakeryAi);
      spinWheelOpenButton.addEventListener("click", openPrizeWheel);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (!currentUser && !isDemo) return;
          if (!hiddenSince) hiddenSince = Date.now();
          saveOfflineDeparture();
          return;
        }
        if (!hiddenSince || (!currentUser && !isDemo)) {
          hiddenSince = 0;
          return;
        }
        const now = Date.now();
        const elapsed = Math.max(0, now - hiddenSince);
        hiddenSince = 0;
        queueOfflineCookies(elapsed);
        state.lastSave = now;
        if (currentUser && !isDemo) save(false);
        if (state.pendingOfflineCookies > 0) showOfflineCookieDialog();
      });
      setInterval(() => {
        if (!currentUser || document.hidden) return;
        refreshExpiredVip();
        updateWheelButton();
        updateOpenWheelControls();
        const rate = cookiesPerSecond();
        const autoBakeRate = isOwner() ? state.ownerTools.autoBakeRate : isAdmin() ? state.adminTools.autoBakeRate : 0;
        const automaticCookies = cookiesPerTap() * autoBakeRate;
        const totalProduction = rate + automaticCookies;
        if (totalProduction > 0) {
          addCookies(totalProduction);
          state.taps = addSafeCounter(state.taps, autoBakeRate);
          updateLiveNumbers();
        }
        const before = state.active.length;
        state.active = liveBoosts();
        if (before !== state.active.length) render();
        else if (currentPage === "boosts") updateLiveNumbers();
      }, 1000);
      setInterval(() => { if (currentUser && !document.hidden) save(); }, 1000);
      window.addEventListener("pagehide", saveOfflineDeparture);
      window.addEventListener("beforeunload", saveOfflineDeparture);
      document.querySelectorAll(".dock-button").forEach(button => {
        const iconName = { bake: "bake", market: "market", boosts: "rush", ledger: "ledger", profile: "profile", achievements: "achievements", admin: "comet", owner: "comet" }[button.dataset.page];
        button.querySelector(".dock-icon").innerHTML = iconArt(iconName);
      });
      window.addEventListener("resize", updateDockHighlight);
      restoreRememberedAccountSession();
    })();
  </script>
</body>
</html>
